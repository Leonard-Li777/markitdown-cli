name: Build

on:
  workflow_dispatch:
    inputs:
      build_win32:
        description: 'Build Windows x64'
        type: boolean
        default: false
      build_linux_x64:
        description: 'Build Linux x64'
        type: boolean
        default: false
      build_linux_arm64:
        description: 'Build Linux arm64'
        type: boolean
        default: false
      build_darwin_x64:
        description: 'Build macOS x64 (disabled)'
        type: boolean
        default: false
      build_darwin_arm64:
        description: 'Build macOS arm64'
        type: boolean
        default: false
      create_release:
        description: 'Publish to GitHub Release'
        type: boolean
        default: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          entries='[]'
          append() { entries=$(echo "$entries" | jq -c --argjson item "$1" '. + [$item]'); }
          [ "${{ inputs.build_win32 }}" = "true" ] && append '{"platform":"win32" ,"arch":"x64"  ,"ext":"zip"   ,"runner":"windows-latest"}'
          [ "${{ inputs.build_linux_x64 }}" = "true" ] && append '{"platform":"linux"  ,"arch":"x64"  ,"ext":"tar.gz","runner":"ubuntu-latest"}'
          [ "${{ inputs.build_linux_arm64 }}" = "true" ] && append '{"platform":"linux"  ,"arch":"arm64","ext":"tar.gz","runner":"ubuntu-24.04-arm"}'
          # [ "${{ inputs.build_darwin_x64 }}" = "true" ] && append '{"platform":"darwin" ,"arch":"x64"  ,"ext":"tar.gz","runner":"macos-13"}'
          [ "${{ inputs.build_darwin_arm64 }}" = "true" ] && append '{"platform":"darwin" ,"arch":"arm64","ext":"tar.gz","runner":"macos-latest"}'
          echo "matrix=$entries" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    if: needs.select.outputs.matrix != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install pyinstaller pytesseract

      - name: Build
        run: python scripts/build.py --skip-deps

      - name: Create tar.gz archive
        if: matrix.ext == 'tar.gz'
        run: tar -czf "markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C dist .

      - name: Create zip archive
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $name = "markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}"
          Compress-Archive -Path "dist/*" -DestinationPath "$name.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v5
        with:
          name: markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}
          path: markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.ext }}

  release:
    if: always() && fromJSON(inputs.create_release)
    needs: [select, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate tag
        id: tag
        run: echo "name=v$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/**/*
          generate_release_notes: true
