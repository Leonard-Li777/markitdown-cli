name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            ext: zip
          - os: ubuntu-latest
            platform: linux
            arch: x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            ext: tar.gz
          - os: macos-13
            platform: darwin
            arch: x64
            ext: tar.gz
          - os: macos-latest
            platform: darwin
            arch: arm64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller pytesseract markdown pillow docx2pdf

      - name: Build
        run: python scripts/build.py

      - name: Create archive
        run: |
          $name = "markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}"
          if ("${{ matrix.ext }}" -eq "zip") {
            Compress-Archive -Path "dist/*" -DestinationPath "$name.zip" -CompressionLevel Optimal
          } else {
            tar -czf "$name.tar.gz" -C dist .
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ format('markitdown-bin-{0}-{1}', matrix.platform, matrix.arch) }}
          path: ${{ format('markitdown-bin-{0}-{1}.{2}', matrix.platform, matrix.arch, matrix.ext) }}
