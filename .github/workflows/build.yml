name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: win32
            arch: x64
            ext: zip
            runner: windows-latest
          - platform: linux
            arch: x64
            ext: tar.gz
            runner: self-hosted
          - platform: linux
            arch: arm64
            ext: tar.gz
            runner: self-hosted
          - platform: darwin
            arch: x64
            ext: tar.gz
            runner: macos-13
          - platform: darwin
            arch: arm64
            ext: tar.gz
            runner: macos-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        if: matrix.runner != 'self-hosted'
        with:
          python-version: '3.13'

      - name: Set up QEMU (self-hosted x64)
        if: matrix.runner == 'self-hosted' && matrix.arch == 'x64'
        uses: docker/setup-qemu-action@v3

      - name: Build (GitHub hosted)
        if: matrix.runner != 'self-hosted'
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          python scripts/build.py

      - name: Build arm64 (self-hosted native)
        if: matrix.runner == 'self-hosted' && matrix.arch == 'arm64'
        run: |
          command -v pip3 >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip
          python3 -m pip install --upgrade pip
          python3 scripts/build.py

      - name: Build x64 (self-hosted via Docker + QEMU)
        if: matrix.runner == 'self-hosted' && matrix.arch == 'x64'
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            amd64/ubuntu:22.04 \
            bash -c "
              apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv
              python3 -m venv /venv
              /venv/bin/pip install --upgrade pip
              /venv/bin/python scripts/build.py
            "

      - name: Fix permissions (self-hosted Docker)
        if: matrix.runner == 'self-hosted' && matrix.arch == 'x64'
        run: sudo chown -R $(id -u):$(id -g) dist/ 2>/dev/null || true

      - name: Create tar.gz archive
        if: matrix.ext == 'tar.gz'
        run: tar -czf "markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C dist .

      - name: Create zip archive
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $name = "markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}"
          Compress-Archive -Path "dist/*" -DestinationPath "$name.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}
          path: markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.ext }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
