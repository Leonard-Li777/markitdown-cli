name: Build

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      build_win32:
        description: 'Build Windows x64'
        type: boolean
        default: true
      build_linux_x64:
        description: 'Build Linux x64'
        type: boolean
        default: true
      build_linux_arm64:
        description: 'Build Linux arm64'
        type: boolean
        default: true
      build_darwin_x64:
        description: 'Build macOS x64'
        type: boolean
        default: true
      build_darwin_arm64:
        description: 'Build macOS arm64'
        type: boolean
        default: true
      create_release:
        description: 'Publish to GitHub Release'
        type: boolean
        default: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          entries='[]'
          append() { entries=$(echo "$entries" | jq -c --argjson item "$1" '. + [$item]'); }
          [ "${{ github.event_name == 'push' || inputs.build_win32 == true || inputs.build_win32 == 'true' }}" = "true" ] && append '{"platform":"win32" ,"arch":"x64"  ,"ext":"zip"   ,"runner":"windows-latest"}'
          [ "${{ github.event_name == 'push' || inputs.build_linux_x64 == true || inputs.build_linux_x64 == 'true' }}" = "true" ] && append '{"platform":"linux"  ,"arch":"x64"  ,"ext":"tar.gz","runner":"ubuntu-latest"}'
          [ "${{ github.event_name == 'push' || inputs.build_linux_arm64 == true || inputs.build_linux_arm64 == 'true' }}" = "true" ] && append '{"platform":"linux"  ,"arch":"arm64","ext":"tar.gz","runner":"ubuntu-24.04-arm"}'
          [ "${{ github.event_name == 'push' || inputs.build_darwin_x64 == true || inputs.build_darwin_x64 == 'true' }}" = "true" ] && append '{"platform":"darwin" ,"arch":"x64"  ,"ext":"tar.gz","runner":"macos-15-intel"}'
          [ "${{ github.event_name == 'push' || inputs.build_darwin_arm64 == true || inputs.build_darwin_arm64 == 'true' }}" = "true" ] && append '{"platform":"darwin" ,"arch":"arm64","ext":"tar.gz","runner":"macos-latest"}'
          echo "matrix=$entries" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    if: needs.select.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install pyinstaller pytesseract
          pip install -e markitdown/packages/markitdown
          pip install -e markitdown/packages/markitdown-ocr

      - name: Install patchelf (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Show PyInstaller version
        run: python3 -m PyInstaller --version

      - name: Build
        env:
          # Avoid onnxruntime device scan noise/hangs during PyInstaller analysis
          ORT_DISABLE_DEVICE_DISCOVERY: "1"
          MARKITDOWN_BUILD_VERSION: 1.0.${{ github.run_number }}
        run: python -u scripts/build.py --skip-deps

      - name: Debug encodings bundle
        shell: bash
        run: |
          echo "=== encodings layout ==="
          find dist -type d -name 'encodings' 2>/dev/null | head -5 || true
          # Detect onefile vs onedir: onefile has no _internal/ directory
          if [ -d "dist/_internal" ] || [ -d "dist/markitdown/_internal" ]; then
            MODE="onedir"
          else
            MODE="onefile"
          fi
          echo "Build mode: $MODE"
          ZIP=""
          for candidate in dist/_internal/base_library.zip dist/markitdown/_internal/base_library.zip; do
            if [ -f "$candidate" ]; then ZIP="$candidate"; break; fi
          done
          if [ -n "$ZIP" ]; then
            python3 -c "import zipfile; z=zipfile.ZipFile('$ZIP'); n=sorted(z.namelist()); h=any(x.startswith('encodings/') for x in n); print('zip:', '$ZIP'); print('encodings in zip:', h)"
          elif [ "$MODE" = "onefile" ]; then
            echo "onefile mode: encodings bundled inside exe (not verifiable from dist/)"
          else
            echo "no base_library.zip (noarchive mode — loose files expected)"
          fi
          if [ -f build/pyinstaller.log ]; then
            echo "=== PyInstaller log tail ==="
            tail -30 build/pyinstaller.log
          fi

      - name: Smoke test
        shell: bash
        run: |
          echo "=== Check binary exists ==="
          if [ "${{ matrix.platform }}" = "win32" ]; then
            EXE="dist/markitdown.exe"
          else
            EXE="dist/markitdown"
          fi
          test -f "$EXE" || { echo "FAIL: $EXE not found"; exit 1; }

          # Detect onefile vs onedir
          if [ -d "dist/_internal" ] || [ -d "dist/markitdown/_internal" ]; then
            MODE="onedir"
          else
            MODE="onefile"
          fi
          echo "Build mode: $MODE"

          if [ "$MODE" = "onedir" ]; then
            echo "=== Check libpython is bundled ==="
            if [ "${{ matrix.platform }}" = "linux" ]; then
              if ! find dist/ -name 'libpython3*.so*' | grep -q .; then
                echo "FAIL: libpython .so not found in dist/"
                exit 1
              fi
            elif [ "${{ matrix.platform }}" = "darwin" ]; then
              if ! find dist/ -name 'libpython3*.dylib' -o -name 'Python3' -o -name 'Python' | grep -q .; then
                echo "FAIL: libpython (.dylib / Python3 / Python) not found in dist/"
                exit 1
              fi
            fi

            echo "=== Check certifi CA bundle is bundled ==="
            if ! find dist/ -name 'cacert.pem' | grep -q .; then
              echo "WARN: cacert.pem not found — HTTPS may fail"
            fi

            echo "=== Check encodings available ==="
            ENC_OK=0
            if find dist/ -path '*/encodings/__init__.py' | grep -q .; then
              echo "encodings loose files: OK"
              ENC_OK=1
            fi
            ZIP=""
            for candidate in dist/_internal/base_library.zip dist/markitdown/_internal/base_library.zip; do
              if [ -f "$candidate" ]; then ZIP="$candidate"; break; fi
            done
            if [ -n "$ZIP" ]; then
              python3 -c "import zipfile,sys; z=zipfile.ZipFile('$ZIP'); ok=any(n.startswith('encodings/') for n in z.namelist()); print('encodings in zip:', ok); sys.exit(0 if ok else 1)" && ENC_OK=1
            fi
            if [ "$ENC_OK" -eq 0 ]; then
              echo "FAIL: encodings not found (neither loose dir nor base_library.zip)"
              exit 1
            fi
          else
            echo "=== onefile mode: libpython/encodings/cacert bundled inside exe ==="
            SIZE=$(stat -c%s "$EXE" 2>/dev/null || stat -f%z "$EXE" 2>/dev/null)
            echo "Executable size: $(( SIZE / 1024 / 1024 )) MB"
          fi

          echo "=== Run --help ==="
          "$EXE" --help

      - name: Create tar.gz archive
        if: matrix.ext == 'tar.gz'
        run: tar -czf "markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C dist .

      - name: Create zip archive
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $name = "markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}"
          Compress-Archive -Path "dist/*" -DestinationPath "$name.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v5
        with:
          name: markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}
          path: markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.ext }}

  release:
    if: always() && (github.event_name == 'push' || inputs.create_release == true)
    needs: [select, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate tag
        id: tag
        run: echo "name=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/**/*
          generate_release_notes: true
