name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: [arm64, x64]
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (x64 on ARM64 host)
        if: matrix.arch == 'x64'
        uses: docker/setup-qemu-action@v3

      - name: Build arm64 (native)
        if: matrix.arch == 'arm64'
        run: |
          python3 -m pip install --upgrade pip
          python3 scripts/build.py

      - name: Build x64 (via Docker multiarch)
        if: matrix.arch == 'x64'
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            amd64/ubuntu:22.04 \
            bash -c "
              apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv
              python3 -m venv /venv
              /venv/bin/pip install --upgrade pip
              /venv/bin/python scripts/build.py
            "

      - name: Fix permissions (Docker creates files as root)
        if: matrix.arch == 'x64'
        run: sudo chown -R $(id -u):$(id -g) dist/ 2>/dev/null || true

      - name: Create archive
        run: |
          name="markitdown-bin-linux-${{ matrix.arch }}"
          tar -czf "${name}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: markitdown-bin-linux-${{ matrix.arch }}
          path: markitdown-bin-linux-${{ matrix.arch }}.tar.gz
