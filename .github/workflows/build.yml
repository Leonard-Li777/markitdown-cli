name: Build

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      build_win32:
        description: 'Build Windows x64'
        type: boolean
        default: true
      build_linux_x64:
        description: 'Build Linux x64'
        type: boolean
        default: true
      build_linux_arm64:
        description: 'Build Linux arm64'
        type: boolean
        default: true
      build_darwin_x64:
        description: 'Build macOS x64'
        type: boolean
        default: true
      build_darwin_arm64:
        description: 'Build macOS arm64'
        type: boolean
        default: true
      create_release:
        description: 'Publish to GitHub Release'
        type: boolean
        default: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          entries='[]'
          append() { entries=$(echo "$entries" | jq -c --argjson item "$1" '. + [$item]'); }
          [ "${{ github.event_name == 'push' || inputs.build_win32 == true || inputs.build_win32 == 'true' }}" = "true" ] && append '{"platform":"win32" ,"arch":"x64"  ,"ext":"zip"   ,"runner":"windows-latest"}'
          [ "${{ github.event_name == 'push' || inputs.build_linux_x64 == true || inputs.build_linux_x64 == 'true' }}" = "true" ] && append '{"platform":"linux"  ,"arch":"x64"  ,"ext":"tar.gz","runner":"ubuntu-latest"}'
          [ "${{ github.event_name == 'push' || inputs.build_linux_arm64 == true || inputs.build_linux_arm64 == 'true' }}" = "true" ] && append '{"platform":"linux"  ,"arch":"arm64","ext":"tar.gz","runner":"ubuntu-24.04-arm"}'
          [ "${{ github.event_name == 'push' || inputs.build_darwin_x64 == true || inputs.build_darwin_x64 == 'true' }}" = "true" ] && append '{"platform":"darwin" ,"arch":"x64"  ,"ext":"tar.gz","runner":"macos-15-intel"}'
          [ "${{ github.event_name == 'push' || inputs.build_darwin_arm64 == true || inputs.build_darwin_arm64 == 'true' }}" = "true" ] && append '{"platform":"darwin" ,"arch":"arm64","ext":"tar.gz","runner":"macos-latest"}'
          echo "matrix=$entries" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    if: needs.select.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install pyinstaller pytesseract onnxruntime opencv-python-headless numpy pdfminer.six pdfplumber PyMuPDF mammoth python-docx python-pptx pandas openpyxl Pillow
          python -c "import sys; sys.path.insert(0, '.'); import scripts.build as b; b.apply_overrides()"
          pip install -e markitdown/packages/markitdown
          pip install -e markitdown/packages/markitdown-ocr

      - name: Install patchelf (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Show PyInstaller version
        run: python3 -m PyInstaller --version

      - name: Build
        env:
          # Avoid onnxruntime device scan noise/hangs during PyInstaller analysis
          ORT_DISABLE_DEVICE_DISCOVERY: "1"
          MARKITDOWN_BUILD_VERSION: 1.0.${{ github.run_number }}
        run: python -u scripts/build.py --skip-deps --onefile

      - name: Debug encodings bundle
        shell: bash
        run: |
          echo "=== dist/ contents ==="
          find dist -maxdepth 2 -type f 2>/dev/null | head -10 || true
          if [ -f build/pyinstaller.log ]; then
            echo "=== PyInstaller log tail ==="
            tail -30 build/pyinstaller.log
          fi

      - name: Smoke test
        shell: bash
        run: |
          echo "=== Check binary exists ==="
          if [ "${{ matrix.platform }}" = "win32" ]; then
            EXE="dist/markitdown.exe"
          else
            EXE="dist/markitdown"
          fi
          test -f "$EXE" || { echo "FAIL: $EXE not found"; exit 1; }

          echo "=== Check models directory & files ==="
          test -d "dist/models" || { echo "FAIL: dist/models directory missing!"; exit 1; }
          MODEL_COUNT=$(ls -1 "dist/models" | wc -l)
          echo "Found $MODEL_COUNT model files in dist/models"
          test "$MODEL_COUNT" -ge 6 || { echo "FAIL: Expected at least 6 model files in dist/models, found $MODEL_COUNT!"; exit 1; }

          echo "=== onefile mode: all deps bundled inside exe ==="
          SIZE=$(stat -c%s "$EXE" 2>/dev/null || stat -f%z "$EXE" 2>/dev/null)
          echo "Executable size: $(( SIZE / 1024 / 1024 )) MB"

          echo "=== Run --help ==="
          "$EXE" --help

      - name: Create tar.gz archive
        if: matrix.ext == 'tar.gz'
        run: tar -czf "markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C dist .

      - name: Create zip archive
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $name = "markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}"
          Get-ChildItem -Path "dist" | Compress-Archive -DestinationPath "$name.zip" -CompressionLevel Optimal

      - name: Verify archive contents
        shell: bash
        run: |
          ARCHIVE="markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.ext }}"
          echo "=== Verifying created archive: $ARCHIVE ==="
          test -f "$ARCHIVE" || { echo "FAIL: Archive $ARCHIVE not found"; exit 1; }
          if [ "${{ matrix.ext }}" = "zip" ]; then
            unzip -l "$ARCHIVE" | grep "models/" >/dev/null || { echo "FAIL: Zip archive $ARCHIVE does not contain models/ directory!"; exit 1; }
          else
            tar -tzf "$ARCHIVE" | grep "models/" >/dev/null || { echo "FAIL: Tar archive $ARCHIVE does not contain models/ directory!"; exit 1; }
          fi
          echo "Archive verification SUCCESS: models/ present in $ARCHIVE"

      - uses: actions/upload-artifact@v5
        with:
          name: markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}
          path: markitdown-bin-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.ext }}

  release:
    if: always() && (github.event_name == 'push' || inputs.create_release == true)
    needs: [select, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate tag
        id: tag
        run: echo "name=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/**/*
          generate_release_notes: true
